spring:
  application:
    name: tel-handler
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 5

logging:
  level:
    root: INFO
    de.example.telhandler: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%-5level] %logger{0} - %msg%n"
